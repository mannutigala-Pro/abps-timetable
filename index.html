];
var DN=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],DS=["Mon","Tue","Wed","Thu","Fri","Sat"];
var TW=[[560,600],[600,640],[640,680],[700,740],[740,780],[780,820],[830,870],[870,910]],TS=[[580,620],[620,660],[660,700],[720,760],[760,800]];
function lab(m){var h=Math.floor(m/60);return (h>12?h-12:h)+":"+String(m%60).padStart(2,"0")}
function TT(d){return d==5?TS:TW}
function parse(s,def){var o={};s.split(";").forEach(function(e){if(!e)return;var i=e.indexOf(":"),p=+e.slice(0,i),t=e.slice(i+1).trim(),k=t.lastIndexOf(" ");o[p]=k<0?[def,t]:[t.slice(0,k),t.slice(k+1)]});return o}
var T=R.map(function(r){return{n:r[0],s:r[1],d:r[2].map(function(x){return parse(x,r[1])})}});
var OV={};try{OV=JSON.parse(localStorage.getItem("tt_ov")||"{}")}catch(e){}
for(var k in OV){var q=k.split("-");if(T[q[0]])T[q[0]].d[q[1]]=parse(OV[k],T[q[0]].s)}
var CL={};T.forEach(function(t){t.d.forEach(function(d){for(var p in d)CL[d[p][1]]=1})});
var CLS=Object.keys(CL).sort(function(a,b){return parseInt(a)-parseInt(b)||a.localeCompare(b)});
var now=new Date(),gd=now.getDay(),today=gd==0?0:gd-1,nm=now.getHours()*60+now.getMinutes();
var st={v:"t",day:today,t:0,cl:CLS[0],per:1,wk:false,a:0,msg:"",as:{},mx:6};
document.getElementById("td").textContent=gd==0?"Sunday (holiday)":DN[today];
function ld(i){var n=Object.keys(T[i].d[st.day]).length;for(var k in st.as)if(k.indexOf(st.day+"-")==0&&st.as[k]===i)n++;return n}
function pop(m){var d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9";d.innerHTML='<div style="background:var(--card);color:var(--tx);padding:18px;border-radius:14px;max-width:320px;margin:16px"><b>⚠️ Not allowed</b><p>'+m+'</p><button class="tabs lnk" style="font-size:15px">OK</button></div>';d.onclick=function(){d.remove()};document.body.appendChild(d)}
function curP(d){var a=TT(d);for(var i=0;i<a.length;i++)if(nm>=a[i][0]&&nm<a[i][1])return i+1;return 0}
function $(i){return document.getElementById(i)}
function sel(id,opts,val){return '<select id="'+id+'">'+opts.map(function(o,i){return '<option value="'+o[0]+'"'+(String(o[0])==String(val)?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select>'}
function days(){$("days").innerHTML=DS.map(function(d,i){return '<button data-d="'+i+'" class="'+(i==st.day?"on":"")+'">'+d+'</button>'}).join("")}
function rowH(p,d,tm,main,sub,cls){return '<div class="row '+cls+'"><div class="p">P'+p+'</div><div class="t">'+lab(tm[0])+" – "+lab(tm[1])+'</div><div class="m">'+main+(sub?'<span>'+sub+'</span>':'')+'</div></div>'}
function render(){
 var h="",out="",wk="";
 days();
 $("days").style.display=st.v=="f"&&false?"none":"flex";
 if(st.v=="t"){
  h=sel("sT",T.map(function(t,i){return[i,t.n+" ("+t.s+")"]}),st.t);
  var t=T[st.t],d=t.d[st.day],tm=TT(st.day),cp=st.day==today?curP(st.day):0,c=0;
  for(var p=1;p<=tm.length;p++){var e=d[p];if(e)c++;
   out+=rowH(p,st.day,tm[p-1],e?e[0]+" · Class "+e[1]:"Free period","",(p==cp?"now ":"")+(e?"":"free"));
   if(st.day<5&&(p==3||p==6))out+='<div class="brk">'+(p==3?"Lunch Break 11:20 – 11:40":"Short Break 1:40 – 1:50")+'</div>';
   if(st.day==5&&p==3)out+='<div class="brk">Lunch Break 11:40 – 12:00</div>'}
  out='<div class="s">'+DN[st.day]+" · "+c+" periods</div>"+out;
  wk='<button class="lnk" id="wb">'+(st.wk?"▲ Hide full week":"▼ Show full week")+'</button>';
  if(st.wk){wk+='<table><tr><th></th>'+[1,2,3,4,5,6,7,8].map(function(p){return'<th>P'+p+'</th>'}).join("")+'</tr>'+t.d.map(function(dd,i){var s='<tr><th>'+DS[i]+'</th>';for(var p=1;p<=8;p++){var e=dd[p];s+='<td'+(e?"":' style="color:var(--mu)"')+'>'+(e?e[1]+(e[0]!=t.s?'<br><small>'+e[0]+'</small>':''):"–")+'</td>'}return s+'</tr>'}).join("")+'</table><div class="s">Saturday has only P1–P5 (different timings).</div>'}
 }else if(st.v=="f"){
  var n=st.day==5?5:8;if(st.per>n)st.per=1;
  var pl=[];for(var i=1;i<=n;i++)pl.push([i,"Period "+i+" ("+lab(TT(st.day)[i-1][0])+")"]);
  h=sel("sP",pl,st.per);
  var fr=[],bz=[];T.forEach(function(t){var e=t.d[st.day][st.per];e?bz.push(t.n+" → "+e[0]+" "+e[1]):fr.push(t.n)});
  out='<div class="s">'+DN[st.day]+" · Period "+st.per+'</div><b>Free ('+fr.length+')</b>'+fr.map(function(x){return'<div class="row free"><div class="m"><b>'+x+'</b></div></div>'}).join("")+'<br><b>Busy ('+bz.length+')</b>'+bz.map(function(x){return'<div class="row"><div class="m">'+x+'</div></div>'}).join("")
 }else if(st.v=="s"){
  h=sel("sA",T.map(function(t,i){return[i,t.n]}),st.a)+'<div style="margin-top:8px;font-size:14px">Max periods per teacher per day: <select id="sM" style="width:auto;padding:6px">'+[4,5,6,7,8].map(function(n){return'<option'+(n==st.mx?' selected':'')+'>'+n+'</option>'}).join('')+'</select></div>';
  var at=T[st.a],ad=at.d[st.day],tms=TT(st.day),cnt=0,ro="";
  for(var p=1;p<=tms.length;p++){var e=ad[p];if(!e)continue;cnt++;
   var asg=st.as[st.day+"-"+p];
   var fl=T.map(function(t,i){return i}).filter(function(i){return i!=st.a&&!T[i].d[st.day][p]}).sort(function(a,b){return (T[b].s==at.s)-(T[a].s==at.s)||ld(a)-ld(b)});
   ro+='<div class="row" style="display:block"><div style="display:flex;gap:10px"><div class="p">P'+p+'</div><div class="t">'+lab(tms[p-1][0])+' – '+lab(tms[p-1][1])+'</div><div class="m"><b>'+e[0]+' · Class '+e[1]+'</b>'+(asg!==undefined?'<span style="color:var(--ac)">Substitute: '+T[asg].n+' ✓ (tap again to remove)</span>':'')+'</div></div><div class="chs">'+fl.map(function(i){var L=ld(i),full=L>=st.mx&&asg!==i;return'<button class="ch'+(asg===i?' sel':'')+(full?' no':'')+'" data-p="'+p+'" data-i="'+i+'">'+T[i].n+(T[i].s==at.s?' ★':'')+' · '+L+'/'+st.mx+(full?' 🚫':'')+'</button>'}).join('')+'</div></div>'}
  out='<div class="s">'+at.n+' is absent · '+DN[st.day]+' · '+cnt+' periods need a substitute. Tap a teacher to assign. Chip = periods today / max (★ = same subject, 🚫 = limit reached).</div>'+(cnt?ro:'<div class="em">No periods on this day</div>');
 }else if(st.v=="e"){
  h=sel("sT",T.map(function(t,i){return[i,t.n]}),st.t);
  var et=T[st.t],ed=et.d[st.day],tme=TT(st.day),mm=st.msg;st.msg="";
  out=(mm?'<div class="s">'+mm+'</div>':'')+'<div class="s">'+et.n+' · '+DN[st.day]+' · Leave Class empty = free period. Changes are saved on this device only.</div>';
  for(var p=1;p<=tme.length;p++){var e=ed[p];out+='<div class="row"><div class="p">P'+p+'</div><input class="ei" data-p="'+p+'" data-f="s" placeholder="'+et.s+'" value="'+(e&&e[0]!=et.s?e[0]:'')+'"><input class="ei" data-p="'+p+'" data-f="c" placeholder="Class" value="'+(e?e[1]:'')+'"></div>'}
  out+='<button class="lnk" id="sv">💾 Save</button> &nbsp; <button class="lnk" id="rs">↺ Reset to original</button>';
 }else{
  h=sel("sC",CLS.map(function(c){return[c,"Class "+c]}),st.cl);
  var tm2=TT(st.day),cp2=st.day==today?curP(st.day):0;
  for(var p=1;p<=tm2.length;p++){var f=null;T.forEach(function(t){var e=t.d[st.day][p];if(e&&e[1]==st.cl)f=[e[0],t.n]});
   out+=rowH(p,st.day,tm2[p-1],f?f[0]:"—",f?f[1]:"",(p==cp2?"now ":""))}
  wk='<div class="s" style="margin-top:10px">Class '+st.cl+' – full week time table</div><table><tr><th></th>'+[1,2,3,4,5,6,7,8].map(function(p){return'<th>P'+p+'</th>'}).join('')+'</tr>'+DS.map(function(dn,di){var s='<tr><th>'+dn+'</th>';for(var p=1;p<=8;p++){var x=[];if(di<5||p<=5)T.forEach(function(t){var e=t.d[di][p];if(e&&e[1]==st.cl)x.push(e[0]+'<br><small>'+t.n.split(' ')[0]+'</small>')});s+='<td>'+(x.join('<hr>')||'–')+'</td>'}return s+'</tr>'}).join('')+'</table><div class="s">Saturday has only P1–P5.</div>';
 }
 $("ctl").innerHTML=h;$("out").innerHTML=out;$("wk").innerHTML=wk;
 var a=$("sT");if(a)a.onchange=function(){st.t=+this.value;render()};
 a=$("sP");if(a)a.onchange=function(){st.per=+this.value;render()};

 a=$("sM");if(a)a.onchange=function(){st.mx=+this.value;render()};
 a=$("sv");if(a)a.onclick=function(){var m={};document.querySelectorAll(".ei").forEach(function(i){var p=i.dataset.p;m[p]=m[p]||{};m[p][i.dataset.f]=i.value.trim()});var df=T[st.t].s,s=Object.keys(m).filter(function(p){return m[p].c}).map(function(p){var sj=m[p].s;return p+":"+(sj&&sj!=df?sj+" ":"")+m[p].c.toUpperCase()}).join(";");OV[st.t+"-"+st.day]=s;try{localStorage.setItem("tt_ov",JSON.stringify(OV))}catch(e){}T[st.t].d[st.day]=parse(s,df);st.msg="Saved ✓";render()};
 a=$("rs");if(a)a.onclick=function(){try{localStorage.removeItem("tt_ov")}catch(e){}location.reload()};

}

$("out").onclick=function(e){var b=e.target;if(!b.classList.contains("ch"))return;var p=+b.dataset.p,i=+b.dataset.i,k=st.day+"-"+p;if(st.as[k]===i){delete st.as[k]}else if(ld(i)>=st.mx){pop(T[i].n+" already has "+ld(i)+" periods on "+DN[st.day]+" (max "+st.mx+"). Please choose another teacher.");return}else{st.as[k]=i}render()};
